<!doctype html>
<html lang="de">
<head>
<script src="/static/theme.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/app.css">
<title>Anmelden - OSP-Projektmanagement</title>
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width:420px">
  <div class="text-center mb-4"><img src="/static/favicon.svg" width="48" height="48" alt="">
    <h1 class="h4 mt-2 mb-0">OSP-Projektmanagement</h1><div class="small text-body-secondary">Planung des Oberstufenprojekts im Team</div></div>
  <div class="card shadow-sm"><div class="card-body">
    <h2 class="h5 mb-3">Anmelden</h2>
    <div id="msg"></div>
    <form id="f">
      <div class="mb-3"><label class="form-label" for="email">E-Mail oder Benutzername</label>
        <input class="form-control" id="email" type="text" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="pw">Passwort</label>
        <input class="form-control" id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100">Anmelden</button>
    </form>
  </div></div>
  <p class="mt-3 text-center">Noch kein Konto? <a href="/register">Registrieren</a></p>
</main>
<div class="position-fixed top-0 end-0 p-3"><div class="btn-group btn-group-sm" role="group"><button class="btn btn-outline-secondary" data-theme-set="light">Hell</button><button class="btn btn-outline-secondary" data-theme-set="dark">Dunkel</button><button class="btn btn-outline-secondary" data-theme-set="auto">System</button></div></div>
<script src="/static/common.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  try {
    await App.api('POST', '/login', { email: document.getElementById('email').value, password: document.getElementById('pw').value });
    location.href = '/';
  } catch (err) {
    msg.innerHTML = '<div class="alert alert-danger">' + App.esc(err.message) + '</div>';
  }
});
</script>
</body>
</html>
