<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/app.css">
<title>Anmelden - OSP-Projektmanagement</title>
</head>
<body class="bg-light">
<main class="container py-5" style="max-width:420px">
  <h1 class="h3 mb-4">OSP-Projektmanagement</h1>
  <div class="card"><div class="card-body">
    <h2 class="h5 mb-3">Anmelden</h2>
    <div id="msg"></div>
    <form id="f">
      <div class="mb-3"><label class="form-label" for="email">E-Mail</label>
        <input class="form-control" id="email" type="email" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="pw">Passwort</label>
        <input class="form-control" id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100">Anmelden</button>
    </form>
  </div></div>
  <p class="mt-3 text-center">Noch kein Konto? <a href="/register">Registrieren</a></p>
</main>
<script src="/static/common.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  try {
    await App.api('POST', '/login', { email: document.getElementById('email').value, password: document.getElementById('pw').value });
    location.href = '/';
  } catch (err) {
    msg.innerHTML = '<div class="alert alert-danger">' + App.esc(err.message) + '</div>';
  }
});
</script>
</body>
</html>
