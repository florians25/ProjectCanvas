services:
  osp:
    build: .
    container_name: osp-projektmanagement
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Standard-Admin beim ersten Start (Passwort muss beim ersten Login geändert werden)
      ADMIN_LOGIN: "admin"
      ADMIN_PASSWORD: "admin"
      # auf "true" setzen, wenn die Seite über HTTPS (Reverse-Proxy) läuft
      COOKIE_SECURE: "false"
    volumes:
      - osp-data:/data

volumes:
  osp-data:
